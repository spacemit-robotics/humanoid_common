module: application/native/humanoid_common

tests:
  - name: humanoid-common-functional
    description: >
      robot_base / behavior_manager / transport_executor 从 example 配置跑通离线流程，
      driver_runtime 校验 YAML 后端解析、factory 分派，以及 whole_body 关节、IMU
      状态和控制命令的数据转换；runtime timing 校验绝对周期调度辅助逻辑。
    category: functional
    scopes: [pr]
    timeout_s: 120
    requires:
      commands: [test_robot_base, test_behavior, test_transport_executor, test_driver_runtime,
                 test_runtime_timing]
    command: |
      bash tests/functional.sh

  - name: humanoid-common-error-path
    description: >
      坏/缺配置时各示例程序必须快速失败（非 0 退出、不 hang、不崩溃），
      验证错误处理与参数校验。
    category: functional
    scopes: [pr]
    timeout_s: 90
    requires:
      commands: [test_robot_base, test_behavior, test_transport_executor, test_driver_runtime]
    command: |
      bash tests/error_path.sh

  - name: humanoid-operator-mcp-protocol
    description: >
      Verifies stdio MCP JSON-RPC handling, tool results, error codes and
      list_changed notifications without a running operator service.
    category: functional
    scopes: [pr]
    timeout_s: 20
    requires:
      commands: [test_operator_mcp_protocol]
    command: |
      test_operator_mcp_protocol

  - name: humanoid-operator-mcp-integration
    description: >
      Drives hmi_runtime with a synthetic loopback control endpoint through MCP;
      checks action permissions, lease renewal, busy ownership, stop and exit cleanup.
    category: functional
    scopes: [pr]
    timeout_s: 60
    requires:
      commands: [test_operator_mcp, hmi_runtime, humanoid_operator_mcp]
    command: |
      test_operator_mcp "$(command -v hmi_runtime)" "$(command -v humanoid_operator_mcp)"

  - name: humanoid-operator-voice-web
    description: >
      Verifies HTTPS and WebSocket forwarding, pairing isolation and voice
      lifecycle against synthetic console and speech-engine processes.
    category: functional
    scopes: [pr]
    timeout_s: 120
    workdir: sdk
    requires:
      commands: [python3, openssl]
    command: |
      python3 application/native/humanoid_common/example/operator_service/test_voice_web.py
